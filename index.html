<!doctype html>
<!-- このファイルはhtml -->
<html lang="ja">
  <!-- htmlスタート　このページは日本語 -->

  <head>
    <!-- 設定 -->
    <meta charset="UTF-8" />
    <!-- 文字化け防止　-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- スマホ対応 -->
    <title>給料管理アプリ</title>
    <!-- ブラウザのタイトル -->

    <link rel="stylesheet" href="style.css" />
    <!-- style.cssを読み込む-->
    <script src="https://unpkg.com/xlsx-js-style/dist/xlsx.bundle.js"></script>
    <!--xlsxで出力するときのurl-->
  </head>
  <!-- 設定ここまで -->

  <body>
    <!-- 画面に見える部分 -->
    <main>
    <h1>給料管理アプリ</h1>
    <!--見出し-->

    <h2>メニュー</h2>
    <select id="menu_Select">
      <option value="select">操作を選択</option>
      <option value="register">案件登録</option>
      <option value="edit">案件編集</option>
      <option value="work">案件選択</option>
      <option value="history">履歴確認</option>
      <option value="admin_Edit">管理者用:履歴編集</option>
    </select>
    <section id="select_Section" style="display: block;">
      <h2>使い方</h2>
      <h4>案件登録：新たに登録したい案件の情報を入力し、案件を登録ボタンで完了。</h4>
        <h4>案件編集：既存の案件の情報を修正し、編集を保存ボタンで完了。削除も可能。</h4>
        <h4>案件選択：既存の案件を一つ選択する。
                 時給制なら勤怠を出勤退勤ボタンで管理。
                 単価制は件数の入力後、登録ボタンで完了。</h4>
        <h4>履歴確認：今までの勤怠情報を確認。テキストやExcelに出力可能。</h4>
    </section>

    <section id="register_Section" style="display: none">
      <h2>案件登録</h2>

      <input id="register_Project_Name" type="text" placeholder="案件名" />
      <!-- 案件名を入力-->
      <select id="register_Type">
        <!--選ぶ 基本optionかinputを使う-->
        <option value="hourly">時給制</option>
        <option value="unit">単価制</option>
      </select>

      <input id="register_Salary" type="number" placeholder="金額" />
      <!--金額を入力-->

      <button id="register_Button">案件を登録</button>
    </section>

    <section id="edit_Section" style="display: none">
      <h2>案件編集</h2>

      <p>編集したい案件を選択</p>
      <select id="edit_Project_Select">
        <option>案件を選択</option>
      </select>

      <input id="edit_Project_Name" type="text" placeholder="案件名" />
      <!-- 案件名を編集-->
      <select id="edit_Type">
        <!--制度の編集-->
        <option value="hourly">時給制</option>
        <option value="unit">単価制</option>
      </select>

      <input id="edit_Salary" type="number" placeholder="金額" />
      <!--金額を編集-->

      <button id="edit_Button">編集を保存</button>
      <button id="delete_Button">削除</button>
    </section>

    <section id="work_Section" style="display: none">
      <h2>案件選択</h2>

      <p id="work_Result">ここに金額が表示されます</p>

      <select id="work_Project_Select">
        <option>案件を選択</option>
      </select>

      <section id="hourly_System_Section" style="display: none">
        <button id="attend_Button">出勤</button>
        <button id="leaving_Button">退勤</button>
        <button id="break_Start_Button">休始</button>
        <button id="break_End_Button">休終</button>
        <input id="hourly_Work_Note" type="text" placeholder="備考欄" />
      </section>

      <section id="unit_System_Section" style="display: none">
        <input id="work_Number" type="number" placeholder="件数" />
        <button id="unit_Work_Button">登録</button>

        <input id="unit_Work_Note" type="text" placeholder="備考欄" />
      </section>
    </section>
    <section id="history_Section" style="display: none">
      <h2>履歴確認</h2>
      <button id="csv_Button">CSV出力</button>
      <button id="xlsx_Button">xlsx出力</button>

      <section id="history_List"></section>
      </section>
    <section id="admin_History_Edit_Section" style="display: none">
      <h2>管理者用：履歴編集</h2>
      <select id="admin_Menu_Select">
        <option value="">操作を選択</option>
        <option value="admin_Register">新しい案件を入力</option>
        <option value="admin_Edit">案件を編集</option>
      </select>

      <section id="admin_Register_Section" style="display: none">
        <input
          id="admin_Register_Project_Name"
          type="text"
          placeholder="案件名"
        />
        <input id="admin_Register_Salary" type="number" placeholder="金額" />
        <input id="work_Date" type="date" placeholder="勤務日を入力" />
        <input id="admin_Register_Note" type="text" placeholder="備考欄" />

        <button id="admin_Register_Button">登録する</button>
      </section>

      <section id="admin_Edit_Section" style="display: none">
        <p>編集する案件を選択</p>

        <select id="admin_History_Select">
          <option value="">履歴を選択</option>
        </select>

        <input id="admin_Edit_Project_Name" type="text" placeholder="案件名" readonly />
      <section id="admin_Hourly_Edit" style="display: none;">
        <input id="admin_Edit_Minutes" type="number" placeholder="勤務分数" />
      </section>
      <section id="admin_Unit_Edit" style="display:none;">
        <input id="admin_Edit_Count" type="number" placeholder="件数" />
      </section>
      <section id="admin_Admin_Edit" style="display: none;">
        <input id="admin_Edit_Salary" type="number" placeholder="金額" />
      </section>
        <input id="admin_Edit_Note" type="text" placeholder="備考欄" />

        <button id="admin_Update_Button">更新する</button>
        <button id="admin_Delete_Button">削除する</button>
      </section>
    </section>
    <script type="module" src="script.js"></script>
    <!--script.jsをつなぐ-->
    </main>
  </body>
  <!--見える部分終わり-->
</html>
<!--html終了-->
